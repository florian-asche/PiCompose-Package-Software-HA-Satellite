name: Build and publish a version

on:
  workflow_dispatch:
  release:
    types: [released]

permissions:
  contents: read

jobs:
  package:
    name: Package
    uses: florian-asche/PiCompose-Repository/.github/workflows/package-tag-build.yml@main
    permissions:
      contents: write
    secrets:
      hub-token: ${{ secrets.HUB_DISPATCH_TOKEN }}
